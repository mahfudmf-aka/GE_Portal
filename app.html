<script src="assets/clean-route-adapter.js?v=r15.1"></script><script>
(async function(){
 const outlet=document.getElementById('cleanPageOutlet');
 const reveal=()=>document.documentElement.classList.remove('ge-route-pending');
 try{
  // Protected page content must never boot before Firebase auth + authoritative profile/role are resolved.
  if(!window.GX_AUTH_READY) throw new Error('Authentication bootstrap tidak tersedia.');
  await window.GX_AUTH_READY;
  if(!window.gxGetSession?.()) return; // auth bootstrap is redirecting to login or access fallback.

  const params=new URLSearchParams(location.search); let route=String(params.get('page')||'index').trim().toLowerCase();
  // app.html is the SPA host, never a logical page. Recover stale/legacy ?page=app links before rendering.
  if(route==='app'){route='index';params.set('page','index');history.replaceState(null,'','app.html?'+params.toString());}
  const alias=(window.P40_CLEAN_ALIASES||{})[route];if(alias){const parts=String(alias).split('?');route=parts[0];if(parts[1])new URLSearchParams(parts[1]).forEach((v,k)=>{if(!params.has(k))params.set(k,v)});params.set('page',route);history.replaceState(null,'','app.html?'+params.toString());}
  const def=window.P40_CLEAN_PAGES[route];
  if(!def){outlet.innerHTML='<div class="clean-page-error"><h2>Page tidak ditemukan</h2><p>'+route+'</p></div>';reveal();return;}
  document.title=def.title+' — Ground Experience Portal'; outlet.innerHTML=def.html; if(route==='airport-experience'){const view=params.get('view')==='map'?'map':'overview';outlet.dataset.airportView=view;outlet.querySelector('[data-section=map]')?.toggleAttribute('hidden',view!=='map');outlet.querySelector('[data-section=network]')?.toggleAttribute('hidden',view!=='overview');}
  // Route-specific styles not already in the canonical shell.
  for(const href of def.styles||[]){ if([...document.styleSheets].some(x=>x.href&&x.href.includes(href.split('?')[0]))) continue; const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l); }
  function loadSrc(src){return new Promise((resolve,reject)=>{const existing=[...document.scripts].find(x=>x.src&&x.src.includes(src.split('?')[0]));if(existing&&((src.includes('edition1-store.js')&&window.GEStore)||!src.includes('edition1-store.js')))return resolve();const attempt=(url,fallback)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(done)return;done=true;s.remove();if(fallback)attempt(src.split('?')[0],false);else reject(new Error('Timeout memuat '+src));},6000);s.src=url;s.onload=()=>{if(done)return;done=true;clearTimeout(timer);resolve();};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);s.remove();if(fallback)attempt(src.split('?')[0],false);else reject(new Error('Gagal memuat '+src));};document.body.appendChild(s);};attempt(src,true);});}
  for(const item of def.scripts||[]){ if(item.src){await loadSrc(item.src);} else if(item.code){(0,eval)(item.code);} }
  if(['airport-experience','station-360','service-experience','capability-classification','monitoring-assessment'].includes(route)){await loadSrc('assets/r43-airport-experience-foundation.js?v=r45');}
  // Canonical runtime pages are initialized explicitly by edition1-page-boot.
  // Re-firing DOMContentLoaded here re-runs global legacy listeners and can create duplicate handlers/recursive render chains.
  const canonicalExplicitBoot=new Set(['index','calendar','airport-experience','inisiatif','lounge-list','standar','admin','berita','service-planning','branch-office-planning','gaso-planning','planning-documents','data']);
  if(!canonicalExplicitBoot.has(route)) document.dispatchEvent(new Event('DOMContentLoaded',{bubbles:true}));
  if(window.geInitR43&&['airport-experience','station-360','service-experience','capability-classification','monitoring-assessment'].includes(route))setTimeout(window.geInitR43,300);
  if(route==='index'){const dashboard=outlet.querySelector('#dashboardRoot');if(dashboard&&!dashboard.children.length){const waitUntil=Date.now()+5000;while(!dashboard.children.length&&Date.now()<waitUntil)await new Promise(resolve=>setTimeout(resolve,60));if(!dashboard.children.length)dashboard.innerHTML='<div class="clean-page-loading">Memuat dashboard…</div>';}}
  if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
  const shellWaitUntil=Date.now()+3000;while(!document.querySelector('.side .ge-nav-link')&&Date.now()<shellWaitUntil)await new Promise(resolve=>setTimeout(resolve,40));
  reveal();
 }catch(err){console.error('[P40 Clean]',err); if(!outlet){reveal();return} const n=document.createElement('div');n.className='clean-page-error';n.innerHTML='<b>Runtime halaman gagal dimuat.</b><br><small>'+String(err.message||err)+'</small>';outlet.replaceChildren(n);reveal();}
})();
